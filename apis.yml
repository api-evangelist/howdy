name: Howdy
description: 'Howdy is a nearshore talent platform that connects US companies with senior
  software engineers, data, DevOps, design, and product professionals across Latin America.
  Operating as an employer of record (EOR), Howdy handles recruiting, vetting, payroll,
  benefits, equipment, compliance, and team performance coaching through physical "Howdy
  Houses" in cities across the region. Founded in 2018 in Austin, Texas by Jacqueline
  Samira and Frank Licea, the company went through Y Combinator (W21) and acquired the
  Brazilian recruiting platform GeekHunter in 2023. It is a services/staffing business
  with no public developer API; this profile captures its public web, agent-facing, and
  legal surface.'
